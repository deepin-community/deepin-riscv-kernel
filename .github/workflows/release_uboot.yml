name: release uboot

on:
  workflow_dispatch:
    inputs:
      profile:
        description: profile name
        required: true

jobs:
  build-uboot:
    uses: ./.github/workflows/build_uboot.yml
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    with:
      profile: ${{ inputs.profile }}

  upload-uboot-release:
    runs-on: ubuntu-24.04
    needs: build-uboot
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: uboot-*
      - run: mkdir -p artifacts-upload
      - run: for artifact in $(ls artifacts); do mkdir -p artifacts-upload/$artifact; done
      - run: for artifact in $(ls artifacts); do tar czf artifacts-upload/$artifact.tar.gz -C artifacts/$artifact .; done
      - run: sudo apt -y install s3cmd
      - run: |
          echo "[default]" >> .s3-cf.conf
          echo "access_key = ${{ secrets.CF_S3_ACCESS_KEY }}" >> .s3-cf.conf
          echo "secret_key = ${{ secrets.CF_S3_SECRET_KEY }}" >> .s3-cf.conf
          echo "host_base = ${{ secrets.CF_S3_HOST }}" >> .s3-cf.conf
          echo "host_bucket = ${{ secrets.CF_S3_HOST_BUCKET }}" >> .s3-cf.conf
          echo "bucket_location = auto" >> .s3-cf.conf
          echo "enable_multipart = False" >> .s3-cf.conf
      - run: s3cmd --recursive -c ./.s3-cf.conf put artifacts-upload/* s3://deepin-ports-kernel/release/u-boot/
